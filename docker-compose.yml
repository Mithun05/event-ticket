
version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: event-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: events
    ports:
      - "5432:5432"

  api:
    build: .
    container_name: event-api
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/events
    ports:
      - "3000:3000"
